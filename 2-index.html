<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TRQN 美島 · 3D 試玩</title>
<style>
  :root {
    --ink: #251f21;
    --panel: rgba(255, 251, 247, 0.94);
    --teal: #73a89a;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1430; }
  #scene { position: fixed; inset: 0; touch-action: none; }
  .chip {
    position: fixed; z-index: 10; font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
    color: var(--ink); background: var(--panel); border-radius: 14px;
    box-shadow: 0 4px 18px rgba(20, 10, 40, 0.25);
  }
  #title { top: 14px; left: 14px; padding: 10px 14px; }
  #title .t { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
  #title .s { font-size: 11px; opacity: 0.65; margin-top: 2px; }
  #modes { top: 14px; right: 14px; padding: 6px; display: flex; gap: 4px; }
  #modes button {
    border: 0; background: transparent; color: var(--ink); font-size: 13px; font-weight: 600;
    padding: 8px 12px; border-radius: 9px; cursor: pointer; font-family: inherit; min-height: 36px;
  }
  #modes button.on { background: var(--teal); color: #fff; }
  #entries { top: 84px; left: 14px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  #entries .h { font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; opacity: 0.55; padding: 0 4px; }
  #entries a {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    text-decoration: none; color: var(--ink); font-size: 13px; font-weight: 700;
    background: #fff; border: 1px solid #ddd5cd; padding: 8px 12px; border-radius: 9px;
    min-height: 36px; box-sizing: border-box; font-family: inherit;
  }
  #entries a .go { color: var(--teal); font-weight: 700; }
  #toast {
    left: 50%; bottom: 96px; transform: translateX(-50%);
    padding: 8px 14px; font-size: 12.5px; white-space: nowrap;
    transition: opacity 0.6s; pointer-events: none;
    background: #fffaf3; border: 1px solid #e0d6cb; font-weight: 600;
  }
  #tour {
    left: 50%; bottom: 14px; transform: translateX(-50%);
    width: min(430px, calc(100vw - 24px)); padding: 12px 14px 10px;
    display: none; font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
  }
  #tour.open { display: block; }
  #tour .bar { height: 3px; background: #e8e2dc; border-radius: 2px; overflow: hidden; margin-bottom: 9px; }
  #tour .bar i { display: block; height: 100%; background: var(--teal); width: 0; transition: width 0.5s; }
  #tour .step { font-size: 11px; color: var(--teal); font-weight: 700; letter-spacing: 0.06em; }
  #tour .name { font-size: 16px; font-weight: 700; margin: 2px 0 4px; }
  #tour .desc { font-size: 13px; line-height: 1.55; opacity: 0.85; }
  #tour .hint { font-size: 12px; margin-top: 6px; color: #8a6d3b; }
  #tour .hint::before { content: "✦ "; }
  #tour .btns { display: flex; gap: 6px; margin-top: 10px; }
  #tour .btns button {
    flex: 1; border: 1px solid #ddd5cd; background: #fff; color: var(--ink);
    font-size: 12.5px; font-weight: 600; padding: 8px 4px; border-radius: 9px;
    cursor: pointer; font-family: inherit; min-height: 36px;
  }
  #tour .btns button.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
  #list {
    position: fixed; inset: 0; z-index: 20; display: none;
    background: rgba(18, 12, 36, 0.55); backdrop-filter: blur(3px);
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
  }
  #list.open { display: flex; align-items: flex-end; justify-content: center; }
  #list .sheet {
    background: var(--panel); color: var(--ink); width: min(430px, 100vw);
    border-radius: 18px 18px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    max-height: 70vh; overflow: auto;
  }
  #list .sheet h2 { font-size: 15px; margin: 0 0 10px; }
  #list .item {
    display: flex; gap: 12px; align-items: baseline; padding: 11px 6px;
    border-top: 1px solid #ece5de; cursor: pointer;
  }
  #list .item .n { color: var(--teal); font-weight: 700; font-size: 13px; min-width: 18px; }
  #list .item .nm { font-weight: 700; font-size: 14px; }
  #list .item .d { font-size: 12px; opacity: 0.7; margin-top: 2px; }
  #list .close {
    width: 100%; margin-top: 12px; border: 0; background: var(--ink); color: #fff;
    padding: 12px; border-radius: 11px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  @media (max-width: 640px) {
    #entries { top: 62px; padding: 5px; }
    #entries .h { display: none; }
    #entries a { font-size: 12px; padding: 7px 10px; min-height: 34px; }
    #title { padding: 8px 11px; }
    #title .t { font-size: 13px; }
    #title .s { display: none; }
    #modes { padding: 4px; }
    #modes button { font-size: 12px; padding: 7px 9px; }
  }
</style>
</head>
<body>
<div id="scene"></div>
<div id="title" class="chip">
  <div class="t">TRQN 美島 · 3D 試玩</div>
  <div class="s">拖曳轉動 · 滾輪或雙指縮放 · 點亮點看景點</div>
</div>
<div id="modes" class="chip">
  <button data-m="free" class="on">自由</button><button data-m="tour">導覽</button><button data-m="top">鳥瞰</button><button data-m="list">清單</button>
</div>
<div id="toast" class="chip" style="opacity:0"></div>
<div id="tour" class="chip">
  <div class="bar"><i id="tourbar"></i></div>
  <div class="step" id="tourstep"></div>
  <div class="name" id="tourname"></div>
  <div class="desc" id="tourdesc"></div>
  <div class="hint" id="tourhint"></div>
  <div class="btns">
    <button id="btn-prev">上一個</button>
    <button id="btn-pause" class="primary">暫停</button>
    <button id="btn-next">下一個</button>
    <button id="btn-end">結束導覽</button>
  </div>
</div>
<div id="list">
  <div class="sheet">
    <h2>景點清單</h2>
    <div id="listitems"></div>
    <button class="close">關閉</button>
  </div>
</div>
<script type="importmap">{ "imports": { "three": "./three.module.min.js" } }</script>
<script type="module" src="./main.js"></script>
</body>
</html>
